name: Research website

on:
  push:
    branches: [main]
    paths:
      - README.md
      - site/**
      - scripts/**
      - tests/**
      - package.json
      - .github/workflows/pages.yml
  pull_request:
    branches: [main]
    paths:
      - README.md
      - site/**
      - scripts/**
      - tests/**
      - package.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# Keep one production deployment at a time. Superseded pull requests may cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository and README history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test catalog generation and search
        run: npm test
      - name: Build website for the repository subpath
        env:
          BASE_PATH: /Awesome-Touch/
        run: npm run build
      - name: Upload website
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
